# Based on https://sabre.io/baikal/install/

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root   /var/www/baikal/html;
  index index.php;

  rewrite ^/.well-known/caldav /dav.php redirect;
  rewrite ^/.well-known/carddav /dav.php redirect;

  charset utf-8;

  client_max_body_size 50M;

  include /etc/nginx/security-headers.inc;

  location = /health.php {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
  }

  location = /info.php {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
  }

  # Classic Formal admin removed — bare /admin → portal (install still PHP redirects)
  location = /admin {
    return 302 /portal/;
  }
  location = /admin/ {
    return 302 /portal/;
  }

  # User portal SPA (TypeScript build → html/portal/)
  location = /portal {
    return 301 /portal/;
  }
  # Hashed build assets (content-addressed filenames) can be cached long-term
  location /portal/assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # HTML shell must not be cached — it references the current hashed JS/CSS
  location = /portal/index.html {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }
  location /portal/ {
    # Prefer static assets; SPA fallback to index.html (avoid directory 403)
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/index.html /portal/index.html;
  }

  # Portal JSON API → html/api/index.php with PATH_INFO=/login etc.
  location = /api {
    return 301 /api/;
  }
  location ~ ^/api(?:/(.*))?$ {
    include        /etc/nginx/fastcgi_params;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root/api/index.php;
    fastcgi_param  PATH_INFO        /$1;
    # Large ICS/VCF imports stream NDJSON progress for up to ~15 minutes.
    # Without a high read timeout, nginx returns 504 after the default gap
    # (was 300s) while PHP is still writing calendar objects.
    fastcgi_read_timeout 900s;
    fastcgi_send_timeout 900s;
    fastcgi_connect_timeout 60s;
    # Pass progress lines to the client immediately (do not buffer the whole import)
    fastcgi_buffering off;
    gzip off;
    # Portal Files multipart uploads + large ICS/VCF imports (match PHP 1G).
    # Override at runtime via BAIKAL_DAV_MAX_BODY_SIZE (same as DAV).
    client_max_body_size 1G; # BAIKAL_DAV_UPLOAD_LIMIT
    client_body_timeout 3600s;
    # Allow PATCH for calendar property updates
    limit_except GET POST PUT PATCH DELETE OPTIONS {
      deny all;
    }
  }

  # Combined DAV endpoint, including private generic WebDAV file homes.
  # Stream request bodies to PHP so large PUT requests are not duplicated in
  # nginx temporary storage before application quota checks run.
  location ~ ^/dav\.php(?:/|$) {
    try_files $fastcgi_script_name =404;
    include        /etc/nginx/fastcgi_params;
    fastcgi_split_path_info  ^(.+\.php)(.*)$;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $fastcgi_path_info;
    client_max_body_size 1G; # BAIKAL_DAV_UPLOAD_LIMIT
    client_body_timeout 3600s;
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;
    fastcgi_request_buffering off;
  }

  location ~ /(\.ht|Core|Specific|config) {
    deny all;
    return 404;
  }

  location ~ ^(.+\.php)(.*)$ {
    try_files $fastcgi_script_name =404;
    include        /etc/nginx/fastcgi_params;
    fastcgi_split_path_info  ^(.+\.php)(.*)$;
    fastcgi_pass   unix:/var/run/php-fpm.sock;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_param  PATH_INFO        $fastcgi_path_info;
  }

  location ~ /\.ht {
    deny all;
  }
}
