name: Feature request
description: Request a new feature
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched [open AngaraDAV issues](https://github.com/offsyanka99/AngaraDAV/issues) for this request.
          required: true
        - label: I have also searched [closed AngaraDAV issues](https://github.com/offsyanka99/AngaraDAV/issues?q=is%3Aissue+is%3Aclosed).
          required: true
        - label: I will describe the problem with as much detail as possible.
          required: true
  - type: input
    id: version
    attributes:
      label: AngaraDAV version or image tag
      placeholder: x.y.z
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Problem you are having
  - type: textarea
    id: expected
    attributes:
      label: Suggested solution
      description: Try do be as specific as possible. Please not only explain what the feature does, but also how. When your request is about changing or extending the UI, describe what the UI would look like and how the user would interact with it.
