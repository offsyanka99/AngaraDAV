name: AngaraDAV continuous integration
on:
  push:
    branches:
      - master
      - main
      - release/*
  pull_request:
  workflow_dispatch:

jobs:
  code-analysis:
    name: Code Analysis (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5', '8.6']
        cs-fixer: [ true ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP and Install Composer Dependencies
        uses: ./.github/actions/build
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Calendar timezone dual-format unit test
        run: php tests/php/CalendarTimeZoneResolveTest.php
      - name: Calendar item service unit test
        run: php tests/php/CalendarItemServiceTest.php
      - name: Contact service unit test
        run: php tests/php/ContactServiceTest.php
      - name: WebDAV-Push unit test
        run: php tests/php/PushPluginTest.php
      - name: WebDAV-Push queue merge unit test
        run: php tests/php/PushQueueMergeTest.php
      - name: WebDAV-Push file fan-out unit test
        run: php tests/php/PushFilesFanoutTest.php
      - name: WebDAV-Push file homes DAV test
        run: php tests/php/PushFilesPluginTest.php
      - name: WebDAV-Push registration status unit test
        run: php tests/php/PushLocationStatusTest.php
      - name: WebDAV-Push file homes worker test
        run: php tests/php/PushWorkerFilesTest.php
      - name: WebDAV-Push worker authorization test
        run: php tests/php/PushWorkerAuthorizationTest.php
      - name: WebDAV file-home unit test
        run: php tests/php/FileHomeStorageTest.php
      - name: Portal FileService unit test
        run: php tests/php/FileServiceTest.php
      - name: Portal FileService WebDAV-Push unit test
        run: php tests/php/FileServicePushTest.php
      - name: Portal file download rate-limit unit test
        run: php tests/php/FileDownloadRateLimiterTest.php
      - name: Portal same-origin unit test
        run: php tests/php/SameOriginTest.php
      - name: Portal self-service password change unit test
        run: php tests/php/AuthPasswordChangeTest.php
      - name: Config persist keeps settings on upgrade unit test
        run: php tests/php/ConfigPersistUpgradeTest.php
      - name: Admin security review unit test
        run: php tests/php/AdminSecurityReviewTest.php
      - name: Admin audit unit test
        run: php tests/php/AdminAuditTest.php
      - name: Admin role unit test
        run: php tests/php/AdminAuthTest.php
      - name: Admin route authorization unit test
        run: php tests/php/AdminAuthzRoutesTest.php
      - name: Admin settings backup unit test
        run: php tests/php/AdminBackupServiceTest.php
      - name: Admin data export unit test
        run: php tests/php/AdminDataExportServiceTest.php
      - name: Admin capabilities unit test
        run: php tests/php/AdminCapabilitiesServiceTest.php
      - name: Admin push subscriptions unit test
        run: php tests/php/AdminPushSubscriptionServiceTest.php
      - name: Admin dashboard unit test
        run: php tests/php/AdminDashboardServiceTest.php
      - name: Admin settings unit test
        run: php tests/php/AdminSettingsServiceTest.php
      - name: Admin user resources unit test
        run: php tests/php/AdminUserResourceServiceTest.php
      - name: Admin users unit test
        run: php tests/php/AdminUserServiceTest.php
      - name: ANGARA_* env precedence unit test
        run: php tests/php/AngaraEnvPrecedenceTest.php
      - name: API exception unit test
        run: php tests/php/ApiExceptionTest.php
      - name: Portal session idle unit test
        run: php tests/php/AuthSessionIdleTest.php
      - name: Installer unit test
        run: php tests/php/InstallServiceTest.php
      - name: Note description format unit test
        run: php tests/php/NoteDescriptionFormatTest.php
      - name: Portal UI settings unit test
        run: php tests/php/PortalUiSettingsTest.php
      - name: Portal sync status unit test
        run: php tests/php/SyncStatusServiceTest.php
      - name: Upgrade gate unit test
        run: php tests/php/UpgradeGateTest.php
      - name: Version compare unit test
        run: php tests/php/VersionCompareTest.php
      - name: Nginx CSP headers unit test
        run: php tests/php/NginxCspHeadersTest.php
      - name: Health endpoint unit test
        run: php tests/php/HealthEndpointTest.php
      - name: Local Docker DX unit test
        run: php tests/php/LocalDockerDxTest.php
      - name: Files maintenance scheduler unit test
        run: php tests/php/FilesMaintenanceSchedulerTest.php
      - name: DAV exception logging unit test
        run: php tests/php/ServerExceptionLoggingTest.php
      - name: CalDAV read-only discovery unit test
        run: php tests/php/ReadOnlyPluginTest.php
      - name: Code Analysis (PHP CS-Fixer)
        if: matrix.cs-fixer == true
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --allow-unsupported-php-version=yes
      - name: Code Analysis (PHPStan)
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4', '8.5', '8.6']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: baikal_test
          POSTGRES_USER: baikal
          POSTGRES_PASSWORD: baikal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baikal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP and Install Composer Dependencies
        uses: ./.github/actions/build
        with:
          php-version: ${{ matrix.php-versions }}
      - name: WebDAV file-home database drivers
        env:
          BAIKAL_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=baikal_test
          BAIKAL_TEST_PGSQL_USER: baikal
          BAIKAL_TEST_PGSQL_PASSWORD: baikal
        run: php tests/php/FileSchemaDriverTest.php
      - name: WebDAV-Push PostgreSQL schema
        env:
          BAIKAL_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=baikal_test
          BAIKAL_TEST_PGSQL_USER: baikal
          BAIKAL_TEST_PGSQL_PASSWORD: baikal
        run: php tests/php/PushSchemaPgsqlTest.php

  portal:
    name: Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Test and build
        working-directory: portal
        run: npm ci && npm test && npm run build
